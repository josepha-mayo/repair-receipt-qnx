name: Host checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.14'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install host dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-live.txt
          python -m pip check
      - name: Check browser-script syntax
        shell: bash
        run: |
          for file in web/*.js; do
            node --check "$file"
          done
          node --check normalize-obd.cjs
      - name: Verify missing coverage survives CSV import
        run: node --test verify_obd_import.cjs
      - name: Check offline verifier bytes
        run: python pack_shop.py --check
      - name: Verify work-order ZIP reads and bounds
        run: node --test verify_work_order_archive.cjs
      - name: Verify the shop register and archived QNX signatures
        run: python verify_shop_register.py
      - name: Verify the shop-only server
        run: python verify_shop_server.py
      - name: Verify the consent deadline
        run: python verify_consent.py
