type receipt_vault_t;
type receipt_export_t;
type receipt_owner_t;

allow receipt_owner_t self:ability {
    public_channel
    spawn
    spawn_setuid:2100
    spawn_setgid:2100
    settypeid:receipt_vault_t,receipt_export_t
};

allow receipt_vault_t self:ability {
    public_channel
};

allow receipt_owner_t receipt_vault_t:channel connect;
allow receipt_export_t receipt_owner_t:channel connect;

allow_attach receipt_owner_t /dev/repair-receipt;
